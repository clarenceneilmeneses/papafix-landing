*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{width:1024px;height:500px;overflow:hidden;}
.stage{width:1024px;height:500px;position:relative;overflow:hidden;
 font-family:'DM Sans',sans-serif;}
.icn,.msk{position:relative;overflow:hidden;flex:none;}
.icn img,.msk img{position:absolute;display:block;}
.bl{position:absolute;border-radius:50%;pointer-events:none;}

.stage{background:#fff6ef;}
.b1{width:520px;height:520px;top:-300px;right:-150px;background:rgba(242,107,29,.10);}
.b2{width:340px;height:340px;bottom:-220px;left:-110px;background:rgba(242,107,29,.08);}
.hd{position:absolute;left:58px;right:58px;top:40px;display:flex;align-items:center;gap:24px;}
/* Mascot chip, not the full icon — the icon's own byline turns to mush this small. */
.msk{border-radius:27px;box-shadow:0 14px 26px -12px rgba(120,50,10,.45);}
.wm{font-family:'Sora';font-weight:800;color:#0a0f1e;font-size:48px;letter-spacing:-.03em;
 line-height:1;}
.wmsub{font-weight:600;font-size:20px;color:#8a7c6d;margin-top:7px;}
.pill{margin-left:auto;background:linear-gradient(135deg,#f26b1d,#c2410c);color:#fff;
 font-family:'Sora';font-weight:800;font-size:21px;padding:14px 26px;border-radius:40px;
 box-shadow:0 14px 26px -12px rgba(194,65,12,.6);}
.cards{position:absolute;left:58px;right:58px;bottom:46px;display:grid;
 grid-template-columns:repeat(3,1fr);gap:24px;}
.card{background:#fff;border-radius:28px;padding:28px 28px 30px;
 box-shadow:0 22px 40px -24px rgba(120,50,10,.42);}
.card .si{width:62px;height:62px;background:#ffebda;border-radius:18px;
 display:flex;align-items:center;justify-content:center;}
.card .si svg{width:35px;height:35px;}
.card .ct{font-family:'Sora';font-weight:800;color:#0a0f1e;font-size:28px;line-height:1;
 margin-top:19px;letter-spacing:-.025em;white-space:nowrap;}
.card .cd{font-weight:500;color:#7a6f62;font-size:20px;line-height:1.26;margin-top:11px;}
