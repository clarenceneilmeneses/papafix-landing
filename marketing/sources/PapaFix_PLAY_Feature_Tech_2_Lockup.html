*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{width:1024px;height:500px;overflow:hidden;}
.stage{width:1024px;height:500px;position:relative;overflow:hidden;
 font-family:'DM Sans',sans-serif;}
.icn,.msk{position:relative;overflow:hidden;flex:none;}
.icn img,.msk img{position:absolute;display:block;}
.bl{position:absolute;border-radius:50%;pointer-events:none;}

.stage{background:#0a0f1e;display:flex;align-items:center;justify-content:center;}
.glow1{position:absolute;width:700px;height:700px;left:300px;top:238px;
 transform:translate(-50%,-50%);
 background:radial-gradient(circle,rgba(120,170,245,.62),rgba(42,95,198,.20) 40%,rgba(42,95,198,0) 72%);}
.glow2{position:absolute;width:660px;height:660px;right:-190px;bottom:-300px;
 background:radial-gradient(circle,rgba(42,95,198,.34),rgba(42,95,198,0) 68%);}
.lock{position:relative;display:flex;align-items:center;gap:34px;margin-top:-14px;}
/* Fade the mascot's cropped edge into the background instead of a hard cut. */
.msk{-webkit-mask-image:linear-gradient(#000 74%,rgba(0,0,0,0) 99%),
 linear-gradient(90deg,rgba(0,0,0,0) 0,#000 5%,#000 95%,rgba(0,0,0,0) 100%);
 -webkit-mask-composite:source-in;mask-composite:intersect;}
.eb{font-weight:800;letter-spacing:.19em;text-transform:uppercase;font-size:17px;
 color:#d8e6ff;margin-bottom:12px;}
.wm{font-family:'Sora';font-weight:800;color:#fff;font-size:98px;line-height:.94;
 letter-spacing:-.038em;}
.rule{width:96px;height:6px;border-radius:6px;margin:20px 0 18px;
 background:linear-gradient(90deg,#5b9bea,#2a5fc6);}
.tl{font-weight:600;font-size:27px;color:#c3d9fb;letter-spacing:.005em;}
.chips{position:absolute;left:0;right:0;bottom:52px;display:flex;justify-content:center;gap:14px;}
.chip{font-weight:700;font-size:19px;color:#d8e6ff;background:rgba(255,255,255,.07);
 border:1.5px solid rgba(255,255,255,.14);border-radius:40px;padding:10px 22px;}
